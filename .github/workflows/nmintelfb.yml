# Fork-only test build of NMIntelFB.kext (not part of any upstream PR)
name: NMIntelFB test build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -euo pipefail
          xcodebuild -version; xcrun --show-sdk-version
          SDK="$(xcrun --show-sdk-path)"; KHDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          D=kexts/NMIntelFB; B=out/NMIntelFB.kext; mkdir -p "$B/Contents/MacOS"
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.0 -fapple-kext -mkernel -nostdinc -I"$KHDR" -I"$D" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT -std=c++17 -fno-rtti -fno-exceptions -fno-builtin \
            -fno-common -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -Wno-unused-function -O2 \
            -c "$D/intelfb.cpp" -o out/intelfb.o
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.0 -fapple-kext -nostdlib -Xlinker -kext \
            -lkmodc++ -lkmod -lcc_kext out/intelfb.o -o "$B/Contents/MacOS/NMIntelFB"
          cp "$D/Info.plist" "$B/Contents/Info.plist"
          nm "$B/Contents/MacOS/NMIntelFB" | grep -E 'kmod_info|stolenOffset' || true
          otool -l "$B/Contents/MacOS/NMIntelFB" | grep -A4 LC_BUILD_VERSION || true
          shasum -a 256 "$B/Contents/MacOS/NMIntelFB" | tee out/SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: NMIntelFB-${{ github.sha }}
          path: out/
